apiVersion: v1
kind: Secret
metadata:
  name: triagecrew-secrets
type: Opaque
stringData:
  # Use OPENAI_API_KEY OR GEMINI_API_KEY depending on which provider you configured
  # in the ConfigMap's OPENAI_MODEL_NAME. Leave the unused one as an empty string.
  OPENAI_API_KEY: "your_openai_api_key_here"
  GEMINI_API_KEY: ""
  API_KEY: "your_secure_api_key_here"
  LANGSMITH_API_KEY: "your_langsmith_api_key_here"
  DD_API_KEY: "your_datadog_api_key_here"
