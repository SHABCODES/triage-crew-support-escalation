apiVersion: apps/v1
kind: Deployment
metadata:
  name: triagecrew
  labels:
    app: triagecrew
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triagecrew
  template:
    metadata:
      labels:
        app: triagecrew
    spec:
      containers:
      - name: triagecrew
        image: triagecrew:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: triagecrew-config
        - secretRef:
            name: triagecrew-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
